# NINEFOX SPORTS: vitrine de tênis/material esportivo + painel /admin. SEM porta: túnel "ninefox" (conta Cloudflare do dono) -> http://ninefox-sports:4192.
# Deploy: docker compose up -d na pasta (mudou app/*.js: docker compose up -d --force-recreate ninefox-sports).
services:
  ninefox-sports:
    image: node:22-alpine
    container_name: ninefox-sports
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 192m
    working_dir: /app
    command: ["node", "/app/server.js"]
    env_file: .env
    environment:
      - TZ=America/Sao_Paulo
      - PORT=4192
      - DATA_DIR=/data
    volumes:
      - ./app:/app:ro
      - ./data:/data
    networks: [umbrel_main_network]
networks:
  umbrel_main_network:
    external: true
