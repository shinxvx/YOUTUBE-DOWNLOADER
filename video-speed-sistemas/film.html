<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Speed — A Speed desenvolve (Reels/TikTok)</title>
<!--
  Vídeo publicitário da SPEED (serviço de desenvolvimento de sistemas). Quadro 1080x1920, 30 fps, 56 s.
  render(t) desenha o segundo t de forma determinística (o render.mjs tira um print por quadro).
  No navegador: ?t=12.5 mostra o quadro parado; ?play=1 toca em tempo real (sem áudio).
  Textos, tempos e passos das demonstrações: roteiro.js. Áudio (trilha, efeitos, narração e mixagem): audio.js.
  Fontes (SIL OFL, Google Fonts): Unbounded (títulos) e Manrope (textos). Identidade: speedco.com.br.
-->
<style>
@font-face { font-family: 'Unbounded'; src: url(fonts/Unbounded-latin.woff2) format('woff2'); font-weight: 200 900; }
@font-face { font-family: 'Manrope'; src: url(fonts/Manrope-latin.woff2) format('woff2'); font-weight: 200 800; }
:root { --bg: #0A0A0A; --branco: #FAFAFA; --cinza: #9A9A9A; --cinza2: #4A4A4A; --card: #121212; --linha: rgba(250,250,250,.12); }
* { box-sizing: border-box; }
html, body { margin: 0; background: #000; }
#st { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); color: var(--branco);
  font-family: 'Manrope', sans-serif; -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
.abs { position: absolute; left: 0; top: 0; }
.cena { position: absolute; inset: 0; display: none; }
.tit { font-family: 'Unbounded', sans-serif; font-weight: 800; letter-spacing: -0.01em; line-height: 1.04; white-space: nowrap; }
.lin { position: absolute; left: 0; width: 1080px; text-align: center; }
.lin > span { display: inline-block; }
.mask { overflow: hidden; padding: 0 8px; }
.eyebrow { font-family: 'Manrope'; font-weight: 700; font-size: 30px; letter-spacing: .14em; color: var(--cinza); text-transform: uppercase; }

/* fundo: brilho + setas grandes bem apagadas (como o topo do site) */
#glow { position: absolute; width: 1400px; height: 1400px; left: -160px; top: 260px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,.075) 0%, rgba(255,255,255,0) 68%); }
.chev { position: absolute; left: 0; top: 0; overflow: visible; }

/* mockup de computador */
.pc { position: absolute; width: 1000px; }
.pc .tampa { position: absolute; left: 0; top: 0; width: 1000px; height: 645px; border-radius: 30px; background: #151515;
  border: 2px solid rgba(250,250,250,.14); }
.pc .vp { position: absolute; left: 20px; top: 20px; width: 960px; height: 600px; overflow: hidden; border-radius: 12px; background: #000; }
.pc .base { position: absolute; left: -40px; top: 643px; width: 1080px; height: 30px; border-radius: 0 0 26px 26px;
  background: linear-gradient(#2b2b2b, #161616); border: 2px solid rgba(250,250,250,.10); border-top: none; }
.pc .base::after { content: ''; position: absolute; left: 470px; top: 0; width: 140px; height: 10px; border-radius: 0 0 10px 10px; background: #0d0d0d; }
/* mockup de celular */
.cel { position: absolute; width: 404px; height: 856px; border-radius: 64px; background: #151515; border: 2px solid rgba(250,250,250,.16); }
.cel .vp { position: absolute; left: 12px; top: 12px; width: 376px; height: 828px; overflow: hidden; border-radius: 52px; background: #000; }
.cel .barra { position: absolute; left: 0; top: 0; width: 376px; height: 40px; background: #000; z-index: 3; font: 700 15px 'Manrope'; color: #fff; }
.cel .barra b { position: absolute; left: 34px; top: 12px; font-weight: 700; }
.cel .barra i { position: absolute; left: 133px; top: 9px; width: 110px; height: 28px; border-radius: 16px; background: #000; box-shadow: 0 0 0 1px #1d1d1d; }
.cel .barra u { position: absolute; right: 30px; top: 15px; width: 26px; height: 12px; border-radius: 3px; border: 2px solid #fff; text-decoration: none; }
.cel .barra u::after { content: ''; position: absolute; left: 2px; top: 2px; width: 15px; height: 4px; background: #fff; border-radius: 1px; }
.tela { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.tela img { position: absolute; left: 0; top: 0; display: block; }
.cursor { position: absolute; left: 0; top: 0; width: 40px; height: 40px; z-index: 5; }
.toque { position: absolute; left: 0; top: 0; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; z-index: 5;
  border: 4px solid rgba(255,255,255,.95); background: rgba(255,255,255,.22); }
.onda { position: absolute; left: 0; top: 0; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; z-index: 4; border: 3px solid #fff; }
.presente { position: absolute; border-radius: 18px; overflow: hidden; border: 2px solid rgba(255,255,255,.22); z-index: 4; }

.nome { font-family: 'Unbounded'; font-weight: 800; color: var(--branco); white-space: nowrap; }
.benef { position: absolute; left: 130px; width: 800px; font: 600 44px/1.28 'Manrope'; color: var(--branco); text-align: center; }

/* cena 2 */
.mini { position: absolute; border-radius: 18px; overflow: hidden; border: 2px solid var(--linha); background: #111; }
.mini img { width: 100%; height: 100%; object-fit: cover; object-position: top left; display: block; }
.cardx { position: absolute; width: 400px; height: 540px; border-radius: 28px; background: var(--card); border: 2px solid var(--linha); overflow: hidden; }
.blk { position: absolute; border-radius: 10px; background: #2a2a2a; }
.rot { position: absolute; width: 400px; text-align: center; font: 700 31px/1.25 'Manrope'; color: var(--branco); }
.chip { position: absolute; padding: 8px 18px; border-radius: 999px; font: 800 26px 'Manrope'; white-space: nowrap; }
.compl { position: absolute; left: 0; width: 1080px; text-align: center; font: 700 48px/1.3 'Manrope'; }

/* cena 4 */
#branco { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; background: var(--branco); }

/* cena 5 */
.ctacard { position: absolute; left: 110px; width: 860px; border-radius: 32px; background: #121212; border: 2px solid rgba(250,250,250,.14); }
.ctal { position: absolute; left: 0; width: 860px; text-align: center; white-space: nowrap; }
.ico { display: inline-block; vertical-align: -6px; margin-right: 16px; }

/* legendas */
#leg { position: absolute; left: 70px; width: 940px; bottom: 405px; text-align: center; z-index: 50; }
#leg .pill { display: inline-block; max-width: 940px; padding: 12px 26px 14px; border-radius: 22px; background: rgba(10,10,10,.82);
  font: 700 44px/1.28 'Manrope'; color: var(--branco); }
#leg .w { opacity: .42; }
#leg .w.on { opacity: 1; }
#prog { position: absolute; left: 110px; top: 236px; height: 6px; width: 860px; z-index: 30; }
#prog i { position: absolute; top: 0; height: 6px; border-radius: 3px; background: rgba(250,250,250,.16); overflow: hidden; }
#prog i b { position: absolute; left: 0; top: 0; height: 6px; background: var(--branco); }
</style>
</head>
<body>
<div id="st">
  <div id="glow"></div>
  <svg id="fundo" class="chev" width="1080" height="1920"></svg>
  <div id="c1" class="cena"></div>
  <div id="c2" class="cena"></div>
  <div id="c3" class="cena"></div>
  <div id="cp" class="cena"></div>
  <div id="c4" class="cena"><div id="branco"></div></div>
  <div id="c5" class="cena"></div>
  <div id="prog"></div>
  <svg id="wipe" class="chev" width="1080" height="1920" style="z-index:40"></svg>
  <div id="leg"></div>
</div>
<script src="roteiro.js"></script>
<script>
'use strict';
const R = window.ROTEIRO;
const $ = (s, el = document) => el.querySelector(s);
const mk = (tag, cls, par, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (par) par.appendChild(e); return e; };
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const pr = (t, a, b) => clamp((t - a) / (b - a));
const eo = k => 1 - Math.pow(1 - k, 3);              // ease-out cúbico
const eio = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const eexp = k => k >= 1 ? 1 : 1 - Math.pow(2, -10 * k);
const eback = k => { const c = 1.45; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
// aplica transformações (só o que mudou, para o navegador não refazer tudo)
function S(el, { x = 0, y = 0, s = 1, sx, sy, r = 0, o = 1, blur = 0, ox, oy } = {}) {
  const tr = `translate(${x.toFixed(2)}px,${y.toFixed(2)}px) scale(${(sx ?? s).toFixed(4)},${(sy ?? s).toFixed(4)})${r ? ` rotate(${r.toFixed(2)}deg)` : ''}`;
  if (el._tr !== tr) { el.style.transform = tr; el._tr = tr; }
  const op = o.toFixed(3); if (el._o !== op) { el.style.opacity = op; el._o = op; }
  const vis = o > 0.001 ? 'visible' : 'hidden'; if (el._v !== vis) { el.style.visibility = vis; el._v = vis; }
  const f = blur > 0.05 ? `blur(${blur.toFixed(2)}px)` : 'none'; if (el._f !== f) { el.style.filter = f; el._f = f; }
  if (ox != null && el._or !== ox + oy) { el.style.transformOrigin = `${ox}px ${oy}px`; el._or = ox + oy; }
}
const show = (el, on) => { const v = on ? 'block' : 'none'; if (el._sv !== v) { el.style.display = v; el._sv = v; } };

// ---------- as três setas (mesmo desenho da logo oficial: viewBox 900x771, traço arredondado)
const CHEV = ['M50 150 L252 385 L50 620', 'M300 95 L561 385 L300 675', 'M546 50 L850 385 L546 720'];
const TONS = ['#4A4A4A', '#9A9A9A', '#FAFAFA'];
function setas(svg, tons = TONS, larg = 96) {
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  const ps = CHEV.map((d, i) => { const p = document.createElementNS('http://www.w3.org/2000/svg', 'path'); p.setAttribute('d', d); p.setAttribute('fill', 'none');
    p.setAttribute('stroke', tons[i]); p.setAttribute('stroke-width', larg); p.setAttribute('stroke-linecap', 'round'); p.setAttribute('stroke-linejoin', 'round'); g.appendChild(p); return p; });
  svg.appendChild(g); return { g, ps };
}
const setG = (g, x, y, s, o = 1) => { const v = `translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${s.toFixed(4)})`; if (g._v !== v) { g.setAttribute('transform', v); g._v = v; } const op = o.toFixed(3); if (g._o !== op) { g.setAttribute('opacity', op); g._o = op; } };

// ---------- texto que cabe na largura (mede com a fonte já carregada)
const medidor = mk('span', 'tit', document.body); medidor.style.cssText = 'position:absolute;visibility:hidden;left:-9999px';
function caber(txt, max, tam, peso = 800, fam = 'Unbounded') { medidor.style.fontFamily = fam; medidor.style.fontWeight = peso; medidor.style.fontSize = tam + 'px'; medidor.textContent = txt; const w = medidor.getBoundingClientRect().width; return w > max ? Math.floor(tam * max / w) : tam; }
// título em linhas, cada linha com máscara (o texto sobe de dentro da máscara)
function titulo(par, linhas, { y, tam, max = 750, cor = 'var(--branco)', gap = 1.06, mesmo = true, cores } = {}) {
  let tams = linhas.map(l => caber(l, max, tam)); if (mesmo) { const m = Math.min(...tams); tams = tams.map(() => m); }
  let yy = y; return linhas.map((l, i) => {
    const box = mk('div', 'lin mask', par); box.style.top = yy + 'px'; box.style.height = Math.ceil(tams[i] * 1.2) + 'px';
    const sp = mk('span', 'tit', box, l); sp.style.fontSize = tams[i] + 'px'; sp.style.color = cores ? cores[i] : cor; sp.style.lineHeight = '1.2';
    yy += tams[i] * gap * 1.1; return { box, sp, tam: tams[i] };
  });
}

// ---------- narração / legendas
let FR = [], DUR = {};
function frase(id) { return FR.find(f => f.id === id); }
function falaIni(id) { const f = frase(id); const d = DUR[id] || {}; return f.em + (d.fala_ini || 0); }
function falaFim(id) { const f = frase(id); const d = DUR[id] || {}; return f.em + (d.fala_fim || estimar(f.legenda)); }
const estimar = s => 0.075 * s.length + 0.2;
// instante em que cada palavra é falada (proporcional às letras, dentro do trecho com fala)
function palavras(id) {
  const f = frase(id), a = falaIni(id), b = falaFim(id), ws = f.legenda.split(' '); const tot = ws.reduce((s, w) => s + w.length + 1, 0);
  let acc = 0; return ws.map(w => { const t = a + (b - a) * acc / tot; acc += w.length + 1; return { w, t }; });
}

// ================== MONTAGEM ==================
const st = $('#st');
let PROJ = [], CX = {}, IMGS = [];
const PF = R.cenas.portfolio[0], PD = (R.cenas.portfolio[1] - R.cenas.portfolio[0]) / R.projetos.length;
const src = (pasta, f) => `assets/capturas/${pasta}/${f}`;

function montar() {
  // fundo: setas enormes e apagadas
  const fundo = $('#fundo'); window.F1 = setas(fundo, ['#FAFAFA', '#FAFAFA', '#FAFAFA']);
  // cortina de setas (transição)
  window.W = setas($('#wipe'));

  // ---- cena 1: gancho
  const c1 = $('#c1');
  const s1 = mk('div', 'abs', c1); const sv1 = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); sv1.setAttribute('width', 1080); sv1.setAttribute('height', 1920); sv1.setAttribute('class', 'chev'); s1.appendChild(sv1);
  window.C1 = { setas: setas(sv1), linhas: titulo(c1, R.gancho.linhas, { y: 820, tam: 120 }) };
  // palavras do gancho, uma a uma com a fala
  const pw = palavras(R.gancho.frase); let k = 0;
  C1.palavras = [];
  C1.linhas.forEach(L => { const ws = L.sp.textContent.split(' '); L.sp.textContent = ''; ws.forEach((w, i) => { const sp = mk('span', '', L.sp, w + (i < ws.length - 1 ? '&nbsp;' : '')); sp.style.display = 'inline-block'; C1.palavras.push({ el: sp, t: (pw[k++] || pw[pw.length - 1]).t }); }); });

  // ---- cena 2: solução
  const c2 = $('#c2');
  C2.tit = titulo(c2, ['A SPEED', 'DESENVOLVE.'], { y: 262, tam: 118 });
  C2.minis = R.projetos.map((p, i) => { const m = mk('div', 'mini', c2); const im = mk('img', '', m); im.src = src(p.pasta, p.passos[0].img); IMGS.push(im); return { el: m, cel: p.tela === 'cel' }; });
  // dois cartões: criar do zero / melhorar o que já existe
  C2.cA = mk('div', 'cardx', c2); C2.cB = mk('div', 'cardx', c2);
  C2.cA.style.left = '120px'; C2.cB.style.left = '560px'; C2.cA.style.top = C2.cB.style.top = '600px';
  // cartão A: tela nascendo (blocos)
  C2.blA = [[24, 24, 352, 52, '#232323'], [24, 96, 96, 420, '#1d1d1d'], [136, 96, 240, 96, '#2c2c2c'], [136, 206, 114, 96, '#2c2c2c'], [262, 206, 114, 96, '#2c2c2c'],
    [136, 316, 240, 200, '#1d1d1d']].map(([x, y, w, h, c]) => { const b = mk('div', 'blk', C2.cA); Object.assign(b.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px', background: c }); return b; });
  C2.barras = [0, 1, 2, 3, 4, 5].map(i => { const b = mk('div', 'blk', C2.cA); Object.assign(b.style, { left: 156 + i * 36 + 'px', width: '24px', top: '0px', height: '0px', background: i === 4 ? '#FAFAFA' : '#9A9A9A', borderRadius: '6px' }); return b; });
  C2.kpi = [148, 274].map((x, i) => { const b = mk('div', 'tit', C2.cA, i ? '+38%' : '1.240'); Object.assign(b.style, { position: 'absolute', left: x + 'px', top: '238px', fontSize: '28px', color: '#FAFAFA' }); return b; });
  C2.lbA = mk('div', 'blk', C2.cA); Object.assign(C2.lbA.style, { left: '150px', top: '120px', width: '150px', height: '18px', background: '#FAFAFA' });
  C2.lbA2 = mk('div', 'blk', C2.cA); Object.assign(C2.lbA2.style, { left: '150px', top: '150px', width: '96px', height: '14px', background: '#5a5a5a' });
  C2.trA = mk('div', '', C2.cA); Object.assign(C2.trA.style, { position: 'absolute', inset: '0', border: '3px dashed rgba(250,250,250,.28)', borderRadius: '26px' });
  // cartão B: sistema que já existe, com erro -> resolvido
  C2.blB = [[24, 24, 352, 52], [24, 96, 352, 70], [24, 180, 352, 70], [24, 264, 352, 70], [24, 348, 352, 70], [24, 432, 352, 70]].map(([x, y, w, h], i) => {
    const b = mk('div', 'blk', C2.cB); Object.assign(b.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px', background: i ? '#1f1f1f' : '#232323' });
    if (i) { const a = mk('div', 'blk', b); Object.assign(a.style, { left: '18px', top: '20px', width: '30px', height: '30px', borderRadius: '50%', background: '#3a3a3a' }); const c = mk('div', 'blk', b); Object.assign(c.style, { left: '64px', top: '22px', width: (120 + (i * 37) % 90) + 'px', height: '12px', background: '#4a4a4a' }); const d = mk('div', 'blk', b); Object.assign(d.style, { left: '64px', top: '42px', width: '80px', height: '10px', background: '#333' }); }
    return b; });
  C2.err = mk('div', 'chip', C2.cB, '⚠ Erro no sistema'); Object.assign(C2.err.style, { left: '64px', top: '196px', background: '#3a1414', color: '#ff8a80', border: '2px solid #6b2020' });
  C2.ok = mk('div', 'chip', C2.cB, '✓ Resolvido'); Object.assign(C2.ok.style, { left: '104px', top: '196px', background: '#10301c', color: '#7ee2a0', border: '2px solid #1e5a35' });
  C2.scan = mk('div', '', C2.cB); Object.assign(C2.scan.style, { position: 'absolute', left: '0', top: '0', width: '400px', height: '90px', background: 'linear-gradient(rgba(250,250,250,0), rgba(250,250,250,.16), rgba(250,250,250,0))' });
  C2.rA = mk('div', 'rot', c2, R.solucao.criar); C2.rB = mk('div', 'rot', c2, R.solucao.melhorar);
  C2.rA.style.left = '120px'; C2.rB.style.left = '560px'; C2.rA.style.top = C2.rB.style.top = '1160px';
  C2.p1 = mk('div', 'compl', c2, R.solucao.complemento[0]); C2.p2 = mk('div', 'compl', c2, R.solucao.complemento[1]);
  C2.p1.style.top = '1226px'; C2.p2.style.top = '1288px'; C2.p2.style.color = 'var(--cinza)';

  // ---- cena 3: introdução do portfólio
  const c3 = $('#c3'); window.C3 = { linhas: titulo(c3, R.intro.linhas, { y: 700, tam: 104 }) };
  C3.n = mk('div', 'eyebrow', c3, '6 projetos'); Object.assign(C3.n.style, { position: 'absolute', left: '0', width: '1080px', textAlign: 'center', top: '1080px' });

  // ---- projetos
  const cp = $('#cp');
  const prog = $('#prog'); window.PROG = R.projetos.map((p, i) => { const it = mk('i', '', prog); it.style.left = i * (860 / 6) + 'px'; it.style.width = (860 / 6 - 10) + 'px'; return mk('b', '', it); });
  PROJ = R.projetos.map((p, i) => {
    const g = mk('div', 'abs', cp); g.style.width = '1080px'; g.style.height = '1920px';
    const ey = mk('div', 'eyebrow', g, `Projeto ${String(i + 1).padStart(2, '0')} / 06`); Object.assign(ey.style, { position: 'absolute', left: '0', width: '1080px', textAlign: 'center', top: '268px' });
    const nm = mk('div', 'lin mask', g); nm.style.top = '312px'; const nmT = mk('span', 'nome', nm, p.nome); const tam = caber(p.nome, 770, 104); nmT.style.fontSize = tam + 'px'; nmT.style.lineHeight = '1.2'; nm.style.height = Math.ceil(tam * 1.25) + 'px';
    const bf = mk('div', 'benef', g, p.beneficio); bf.style.top = '1268px';
    let dev, vp;
    if (p.tela === 'pc') { dev = mk('div', 'pc', g); mk('div', 'tampa', dev); vp = mk('div', 'vp', dev); mk('div', 'base', dev); dev.style.left = '40px'; dev.style.top = '520px'; }
    else { dev = mk('div', 'cel', g); vp = mk('div', 'vp', dev); const br = mk('div', 'barra', vp, '<b>9:41</b><i></i><u></u>'); dev.style.left = '338px'; dev.style.top = '410px'; }
    const VW = p.tela === 'pc' ? 960 : 376, VH = p.tela === 'pc' ? 600 : 828, TOP = p.tela === 'pc' ? 0 : 40;
    const tela = mk('div', 'tela', vp); const [W0, H0] = p.tamanho; tela.style.width = W0 + 'px'; tela.style.height = H0 + 'px';
    const imA = mk('img', '', tela), imB = mk('img', '', tela); [imA, imB].forEach(im => { im.style.width = W0 + 'px'; im.style.height = H0 + 'px'; });
    // peça extra do TikSpeed: o efeito de presente aparece por cima do app
    let extra = null; const pe = p.passos.find(s => s.extra); if (pe) { extra = mk('div', 'presente', vp); const im = mk('img', '', extra); im.src = src(p.pasta, pe.img2); im.style.width = '100%'; im.style.display = 'block'; IMGS.push(im); }
    const cur = p.tela === 'pc' ? mk('div', 'cursor', vp, '<svg viewBox="0 0 40 40" width="40" height="40"><path d="M6 3 L6 33 L13.5 26 L18.5 37.5 L24 35 L19 23.8 L29 23.8 Z" fill="#fff" stroke="#111" stroke-width="2.4" stroke-linejoin="round"/></svg>') : mk('div', 'toque', vp);
    const onda = mk('div', 'onda', vp);
    // passos: imagens, toques e zoom

  // A: FEITO PARA A SUA NECESSIDADE (escala lenta)
  const saiA = eio(pr(t, tb - 0.35, tb + 0.05));
  C4.a.forEach((L, i) => { const k = eo(pr(t, R.proposta.aEm + 0.05 + i * 0.22, R.proposta.aEm + 0.5 + i * 0.22)); S(L.sp, { y: (1 - k) * 160 }); S(L.box, { s: 1 + 0.03 * pr(t, a, tb), o: 1 - saiA, y: -saiA * 120, ox: 540, oy: 300 }); });
  // B: painel branco sobe e o preço entra com impacto
  const kw = eio(pr(t, tb - 0.3, tb + 0.1)), kws = eio(pr(t, b - 0.42, b - 0.05));
  S($('#branco'), { y: (1 - kw) * 1920 - kws * 1920, o: 1 });
  C4.b.forEach((L, i) => { const k = eback(pr(t, tb + 0.05 + i * 0.16, tb + 0.42 + i * 0.16)); S(L.sp, { s: lerp(1.14, 1, k), o: clamp(k * 2), ox: L.sp.offsetWidth / 2, oy: 60 }); S(L.box, { y: -kws * 1920, s: 1 + 0.02 * pr(t, tb, b), ox: 540, oy: 300 }); });
  return true;
}

function cena5(t) {
  const [a] = T.cta; if (t < a - 0.1) return false;
  const kl = eexp(pr(t, a + 0.05, a + 0.6));
  S(C5.logo, { s: lerp(0.6, 1, kl), o: kl, x: (1 - kl) * -80, ox: 105, oy: 90 });
  const km = eo(pr(t, a + 0.25, a + 0.7)); S(C5.marca, { y: (1 - km) * 30, o: km }); S(C5.marca2, { y: (1 - km) * 30, o: km * eo(pr(t, a + 0.35, a + 0.8)) });
  const tt = [frase('n08').em, frase('n09').em];
  C5.t.forEach((L, i) => { const k = eo(pr(t, tt[i] - 0.05, tt[i] + 0.4)); S(L.sp, { y: (1 - k) * 110 }); });
  const kc = eexp(pr(t, frase('n10').em - 0.3, frase('n10').em + 0.35)); S(C5.card, { y: (1 - kc) * 90, s: 0.94 + 0.06 * kc, o: kc, ox: 430, oy: 186 });
  [C5.l1, C5.l2, C5.l3].forEach((l, i) => { const k = eo(pr(t, frase('n10').em - 0.1 + i * 0.16, frase('n10').em + 0.35 + i * 0.16)); S(l, { y: (1 - k) * 24, o: k }); });
  return true;
}

function render(t) {
  fundo(t); cortina(t); legendas(t);
  const vis = [cena1(t), cena2(t), cena3(t), projetos(t), cena4(t), cena5(t)];
  CENAS.forEach((c, i) => show(c, vis[i]));
}
window.render = render;

// auditoria: texto fora da área segura ou cortado (render.mjs chama com AUDIT=1)
window.audit = function () {
  const z = R.seguro, out = [];
  for (const el of document.querySelectorAll('.tit, .nome, .benef, .rot, .compl, .eyebrow, .ctal, #leg .pill')) {
    let v = el; let ok = true; while (v && v !== document.body) { const cs = getComputedStyle(v); if (cs.visibility === 'hidden' || +cs.opacity < 0.5) { ok = false; break; } v = v.parentElement; }
    if (!ok) continue; const rg = document.createRange(); rg.selectNodeContents(el); const r = rg.getBoundingClientRect(); if (r.width < 2) continue;
    const nome = (el.textContent || '').trim().slice(0, 28);
    if (r.left < z.x0 - 1 || r.right > z.x1 + 1 || r.top < z.y0 - 1 || r.bottom > z.y1 + 1) out.push(`fora da área segura: "${nome}" [${Math.round(r.left)},${Math.round(r.top)} – ${Math.round(r.right)},${Math.round(r.bottom)}]`);
  }
  return out;
};

window.carregar = async function () {
  const q = new URLSearchParams(location.search);
  const fr = await (await fetch('narracao/frases.json')).json(); FR = fr.frases;
  try { DUR = await (await fetch(`narracao/${q.get('voz') || R.voz}/duracoes.json`)).json(); } catch { DUR = {}; }
  await Promise.all(R.projetos.map(async p => { try { CX[p.pasta] = (await (await fetch(`assets/capturas/${p.pasta}/caixas.json`)).json()).caixas; } catch { CX[p.pasta] = {}; } }));
  await document.fonts.load('800 100px Unbounded'); await document.fonts.load('400 30px Unbounded'); await document.fonts.load('700 40px Manrope'); await document.fonts.load('800 40px Manrope'); await document.fonts.load('600 40px Manrope');
  montar();
  // carrega uma por vez (várias decodificações ao mesmo tempo às vezes falham no Chromium sem tela) e confere o tamanho
  const urls = [...new Set([...IMGS.map(im => im.src), ...PROJ.flatMap(P => P.imgs.map(m => m.src))])];
  window.CACHE = [];
  for (const u of urls) {
    let ok = false;
    for (let k = 0; k < 4 && !ok; k++) { const im = new Image(); im.src = u; try { await im.decode(); ok = im.naturalWidth > 0; } catch { await new Promise(r => setTimeout(r, 150)); } if (ok) CACHE.push(im); }
    if (!ok) console.warn('imagem faltando', u);
  }
  for (const im of IMGS) if (!im.complete || !im.naturalWidth) await new Promise(r => { im.onload = im.onerror = r; setTimeout(r, 3000); });
  render(0); return true;
};
(async () => {
  const q = new URLSearchParams(location.search);
  if (q.has('t') || q.has('play')) {
    await window.carregar();
    if (q.has('t')) render(+q.get('t'));
    if (q.has('play')) { const t0 = performance.now() - (+q.get('play') > 1 ? +q.get('play') * 1000 : 0); const f = () => { const t = (performance.now() - t0) / 1000; render(t % R.duracao); requestAnimationFrame(f); }; f(); }
  }
})();
</script>
