<title>MOVRA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: palco de ensaio. Barra fixa no topo, conteúdo numa coluna larga; aulas são cartas de fase (capa + estrelas + XP). */
:root{
  --bg:#ECE9F2; --surface:#F9F8FB; --surface-2:#E1DCEA; --ink:#16121D; --muted:#625B70; --line:#D2CCDD;
  --accent:#5C02F8; --accent-ink:#FFFFFF; --accent-soft:#E4D9FF; --logo-l:block; --logo-d:none; --hot:#F2346F; --good:#0E9B64; --warn:#C7741F;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px; --shadow:0 1px 0 rgba(22,18,29,.04),0 12px 30px -18px rgba(40,20,90,.35);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D0B12; --surface:#16131D; --surface-2:#221E2C; --ink:#F1ECF7; --muted:#9C94AC; --line:#2C2737;
  --accent:#9E70FF; --accent-ink:#0D0B12; --accent-soft:#2A1C55; --logo-l:none; --logo-d:block; --hot:#FF5E95; --good:#3DD69A; --warn:#F0A04B;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 16px 34px -18px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D0B12; --surface:#16131D; --surface-2:#221E2C; --ink:#F1ECF7; --muted:#9C94AC; --line:#2C2737;
  --accent:#9E70FF; --accent-ink:#0D0B12; --accent-soft:#2A1C55; --logo-l:none; --logo-d:block; --hot:#FF5E95; --good:#3DD69A; --warn:#F0A04B;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 16px 34px -18px rgba(0,0,0,.8); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;height:62px}
.logo{display:flex;align-items:center;text-decoration:none;flex:none}
.logo .lg{height:40px;width:auto}
.lg-l{display:var(--logo-l)}.lg-d{display:var(--logo-d)}
.nav{display:flex;gap:4px;margin-left:8px}
.nav a{text-decoration:none;padding:8px 12px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted)}
.nav a.on,.nav a:hover{color:var(--ink);background:var(--surface-2)}
.acct{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}
.acct button,.acct a{background:none;border:0;cursor:pointer;color:var(--muted);font-weight:700;padding:6px 8px;text-decoration:none}
.acct .who{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.role{margin-left:auto;display:flex;background:var(--surface-2);border-radius:999px;padding:3px}
.role a{text-decoration:none;font-size:13px;font-weight:700;padding:7px 14px;border-radius:999px;color:var(--muted)}
.role a.on{background:var(--ink);color:var(--bg)}
@media (max-width:760px){.nav{display:none}.top .wrap{gap:10px}}
.mnav{display:none}
@media (max-width:760px){
  .mnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-top:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));justify-content:space-around}
  .mnav a{text-decoration:none;font-size:12px;font-weight:700;color:var(--muted);padding:6px 10px;border-radius:10px}
  .mnav a.on{color:var(--accent)}
  body{padding-bottom:64px}
}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:12px 20px;font-weight:800;font-size:14px;cursor:pointer;text-decoration:none;background:var(--ink);color:var(--bg);transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn.acc{background:var(--accent);color:var(--accent-ink)}
.btn.hot{background:var(--hot);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.sm{padding:8px 14px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.chip{border:0;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer;color:var(--muted);white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);box-shadow:none}

/* stars */
.stars{display:inline-flex;gap:2px;vertical-align:middle}
.stars svg{width:14px;height:14px}
.stars .f{fill:var(--hot)}
.stars .e{fill:var(--line)}
.stars.lg svg{width:20px;height:20px}

/* hero */
.hero{padding-block:44px 28px;display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center}
.hero-logo{margin:14px 0 0}.hero-logo .lg{width:min(560px,100%);height:auto}
.hero p{font-size:18px;max-width:30em;color:var(--muted);margin:22px 0 0}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.hero-facts{display:flex;gap:26px;flex-wrap:wrap;margin-top:28px}
.hero-facts div{display:flex;flex-direction:column}
.hero-facts strong{font-family:var(--display);font-size:22px}
.hero-facts span{font-size:12px;color:var(--muted)}
.deck{position:relative;height:420px}
.deck>*{position:absolute!important;width:236px;top:20px;left:50%;transition:transform .4s}
.deck>*:nth-child(1){transform:translateX(-95%) rotate(-9deg) translateY(30px)}
.deck>*:nth-child(2){transform:translateX(-50%) rotate(1deg);z-index:2}
.deck>*:nth-child(3){transform:translateX(-5%) rotate(10deg) translateY(36px)}
.deck:hover>*:nth-child(1){transform:translateX(-110%) rotate(-13deg) translateY(24px)}
.deck:hover>*:nth-child(3){transform:translateX(10%) rotate(14deg) translateY(30px)}
@media (max-width:900px){.hero{grid-template-columns:1fr}.deck{height:330px;overflow:hidden}.deck>*{width:190px}}

/* filters */
.filters{display:flex;flex-direction:column;gap:12px;padding-block:20px;border-top:1px solid var(--line)}
.frow{display:flex;gap:8px;align-items:center;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.frow .eyebrow{min-width:92px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);border-radius:999px;padding:0 14px;max-width:420px}
.search input{border:0;background:transparent;padding:11px 0;outline:none;width:100%}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:34px 0 16px;flex-wrap:wrap}
.sec-head h2{font-size:24px}

/* cards = fases */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.card{display:flex;flex-direction:column;background:var(--surface);border-radius:18px;text-decoration:none;box-shadow:var(--shadow);overflow:hidden;transition:transform .18s,box-shadow .18s;position:relative}
.card:hover{transform:translateY(-4px)}
.cover{--h:260;aspect-ratio:4/4.3;position:relative;padding:14px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;overflow:hidden;
  background:
   radial-gradient(120% 80% at 85% 0%,hsl(calc(var(--h) + 40) 95% 62% / .9),transparent 60%),
   radial-gradient(90% 70% at 0% 100%,hsl(calc(var(--h) - 30) 90% 55% / .85),transparent 65%),
   linear-gradient(160deg,hsl(var(--h) 70% 30%),hsl(calc(var(--h) + 20) 75% 12%))}
.cover.has-img{background:linear-gradient(180deg,rgba(8,6,12,.35) 0%,rgba(8,6,12,0) 30%,rgba(8,6,12,0) 50%,rgba(8,6,12,.78) 100%),var(--img) center/cover no-repeat}
.cover.has-img::after{display:none}
.cover::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.07) 0 2px,transparent 2px 14px);mix-blend-mode:overlay;pointer-events:none}
.cover-top{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}
.lvl{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.12em;background:rgba(0,0,0,.35);padding:5px 8px;border-radius:6px;backdrop-filter:blur(4px)}
.orient{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;font-weight:700;background:rgba(0,0,0,.35);padding:4px 7px;border-radius:6px}
.orient i{display:inline-block;border:1.5px solid #fff;border-radius:2px}
.orient i.h{width:14px;height:9px}.orient i.v{width:9px;height:14px}
.cover-title{position:relative;z-index:1;display:flex;flex-direction:column;gap:2px}
.cover-title .artist{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.cover-title .song{font-family:var(--display);font-weight:900;font-size:26px;line-height:.95;text-transform:uppercase;word-break:break-word;text-shadow:0 2px 18px rgba(0,0,0,.35)}
.cover-title .song{overflow-wrap:normal;word-break:normal;hyphens:none}
.cover-title .song.long{font-size:20px}
.cover-title .song.xl{font-size:16px}
.stamp{position:absolute;right:12px;top:46px;z-index:2;font-family:var(--display);font-weight:900;font-size:18px;letter-spacing:.1em;border:3px solid #fff;padding:2px 10px;border-radius:8px;transform:rotate(-12deg);background:rgba(14,155,100,.85)}
.lockveil{position:absolute;inset:0;z-index:2;background:linear-gradient(180deg,rgba(10,8,16,.25),rgba(10,8,16,.6));display:grid;place-items:center}
.lockveil span{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;font-size:12px;text-align:center;padding:0 12px}
.lockveil svg{width:26px;height:26px;fill:#fff}
.card-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.card-body .row{display:flex;justify-content:space-between;align-items:center}
.xp{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--accent)}
.card-body h3{font-family:var(--body);font-weight:800;font-size:15px;line-height:1.25;letter-spacing:0}
.card-body .meta{font-size:12px;color:var(--muted)}
.card-body .foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:8px;border-top:1px dashed var(--line);font-size:12px;gap:8px}
.state{font-weight:800;font-size:11px;padding:3px 8px;border-radius:999px;white-space:nowrap}
.state.done{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.state.open{background:var(--accent-soft);color:var(--accent)}
.state.pay{background:color-mix(in srgb,var(--hot) 15%,transparent);color:var(--hot)}
.state.pre{background:var(--surface-2);color:var(--muted)}

/* teachers */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.tcard{display:flex;gap:14px;align-items:center;background:var(--surface);border-radius:var(--r);padding:16px;text-decoration:none;box-shadow:var(--shadow)}
.ava{--h:260;width:56px;height:56px;border-radius:16px;flex:none;display:grid;place-items:center;font-family:var(--display);font-weight:900;color:#fff;font-size:18px;background:linear-gradient(135deg,hsl(var(--h) 85% 58%),hsl(calc(var(--h) + 50) 85% 45%))}
.ava.lg{width:96px;height:96px;border-radius:26px;font-size:30px}
.tcard strong{display:block;font-size:15px}
.tcard small{color:var(--muted);font-size:12px}

/* cards de professor */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.pcard{position:relative;aspect-ratio:3/4;border-radius:22px;overflow:hidden;text-decoration:none;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:var(--shadow);max-width:100%;isolation:isolate}
.pphoto{position:absolute;inset:0;display:block;overflow:hidden;z-index:-1}
.pphoto img{width:100%;height:100%;object-fit:cover;object-position:center 22%;display:block;transition:transform .5s}
.pcard:hover .pphoto img,.pcard:hover .ph-gen b{transform:scale(1.05)}
.ph-gen{--h:260;position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:6px;overflow:hidden;
  background:radial-gradient(90% 70% at 80% 10%,hsl(calc(var(--h) + 40) 95% 62%),transparent 60%),radial-gradient(80% 60% at 0% 90%,hsl(calc(var(--h) - 30) 90% 50%),transparent 65%),linear-gradient(160deg,hsl(var(--h) 70% 32%),hsl(calc(var(--h) + 20) 75% 10%))}
.ph-gen b{font-family:var(--display);font-weight:900;font-size:min(42cqw,120px);font-size:120px;line-height:.8;color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.75);transition:transform .5s}
.ph-gen small{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.7}
.pinfo{display:flex;flex-direction:column;gap:8px;padding:60px 18px 18px;background:linear-gradient(180deg,transparent,rgba(8,6,12,.82) 55%)}
.pinfo strong{font-family:var(--display);font-weight:900;font-size:26px;line-height:.95;text-transform:uppercase;letter-spacing:-.01em;text-wrap:balance}
.ptags{display:flex;gap:6px;flex-wrap:wrap}
.ptags i{font-style:normal;font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.18);backdrop-filter:blur(6px)}
.ptags i.free{background:#fff;color:#16121D}
.pmeta{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;font-weight:700;opacity:.9;flex-wrap:wrap}
.pphoto.big{position:relative;inset:auto;z-index:auto;width:150px;height:190px;border-radius:24px;box-shadow:var(--shadow)}
.pphoto.big .ph-gen b{font-size:64px}.pphoto.big .ph-gen small{display:none}
.pphoto.mini{position:relative;inset:auto;z-index:auto;width:40px;height:40px;border-radius:12px;flex:none}
.pphoto.mini .ph-gen b{font-size:16px;-webkit-text-stroke:0;color:#fff}.pphoto.mini .ph-gen small{display:none}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:14px;counter-reset:st}
@media (max-width:860px){.steps{grid-template-columns:1fr 1fr}}@media (max-width:480px){.steps{grid-template-columns:1fr}}
.steps li{counter-increment:st;background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px;box-shadow:inset 0 0 0 1px var(--line)}
.steps li::before{content:"FASE " counter(st);font-family:var(--mono);font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.1em}
.steps span{font-size:13px;color:var(--muted)}
.back{display:inline-block;margin-top:22px;font-weight:700;font-size:13px;text-decoration:none;color:var(--muted)}
.gate{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:18px 20px;border-radius:18px;background:var(--ink);color:var(--bg);margin-bottom:8px}
.gate div{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 300px}
.gate b{font-family:var(--display);font-size:18px}
.gate span{font-size:14px;opacity:.78}
.gate.ok{background:color-mix(in srgb,var(--good) 16%,var(--surface));color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--good)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:18px;overflow-x:auto;scroll-margin-top:80px}
.tabs button{border:0;background:none;padding:12px 16px;font-weight:800;font-size:14px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--hot)}
.tag.free{background:var(--accent-soft);color:var(--accent)}
.ribbon{position:absolute;left:14px;top:46px;z-index:2;background:#fff;color:#16121D;font-family:var(--mono);font-weight:700;font-size:10px;letter-spacing:.14em;padding:5px 9px;border-radius:6px}
.profile{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:inset 0 0 0 1px var(--line)}
.prof-up{position:relative!important;inset:auto!important;z-index:auto!important;width:120px;height:150px;border-radius:18px;cursor:pointer;flex:none}
.prof-up .ph-gen b{font-size:48px}.prof-up .ph-gen small{display:none}
.prof-up .up{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);color:#fff;font-size:11px;font-weight:800;text-align:center;padding:6px}
/* teacher page */
.thead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center;padding-block:34px 20px}
.thead h1{font-size:clamp(30px,5vw,50px);font-weight:900}
.thead p{margin:8px 0 0;max-width:60ch;color:var(--muted)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--surface-2)}
@media (max-width:700px){.thead{grid-template-columns:1fr}}
.plans{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.plan{background:var(--surface);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px;box-shadow:inset 0 0 0 1px var(--line)}
.plan.owned{box-shadow:inset 0 0 0 2px var(--good)}
.plan h3{font-size:16px}
.plan .price{font-family:var(--display);font-weight:900;font-size:28px}
.plan .price small{font-family:var(--body);font-size:13px;font-weight:600;color:var(--muted)}
.plan ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:4px;font-size:13px}
.plan li{display:flex;justify-content:space-between;gap:8px}


/* aula */
.lesson{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:26px;padding-block:26px}
@media (max-width:980px){.lesson{grid-template-columns:minmax(0,1fr)}}
.player{background:#07060A;border-radius:20px;overflow:hidden;position:relative}
.stage{position:relative;display:flex;justify-content:center;background:#07060A}
.stage canvas,.stage video{display:block;width:100%;height:auto;max-height:72vh;object-fit:contain}
.stage.v canvas,.stage.v video{width:auto;height:72vh;max-width:100%}
.stage.mirror video{transform:scaleX(-1)}
.player:fullscreen{display:flex;flex-direction:column}
.player:fullscreen .stage{flex:1;min-height:0}
.player:fullscreen .stage canvas,.player:fullscreen .stage video{width:100%;height:100%;max-height:none;object-fit:contain}
@media (orientation:portrait){.player.crop:fullscreen .stage canvas,.player.crop:fullscreen .stage video{object-fit:cover}}
.veil{position:absolute;inset:0;display:grid;place-items:center;background:rgba(7,6,10,.72);color:#fff;text-align:center;padding:20px}
.veil div{display:flex;flex-direction:column;gap:10px;align-items:center;max-width:380px}
.veil h3{font-size:20px}
.ctrl{display:flex;align-items:center;gap:8px;padding:10px 12px;color:#fff;flex-wrap:wrap;background:#07060A}
.ctrl button{background:rgba(255,255,255,.09);border:0;color:#fff;border-radius:999px;padding:8px 12px;font-weight:700;font-size:12px;cursor:pointer}
.ctrl button.on{background:#fff;color:#07060A}
.ctrl .play{width:40px;height:40px;padding:0;display:grid;place-items:center;background:var(--hot)}
.ctrl .play svg{width:16px;height:16px;fill:#fff}
.ctrl input[type=range]{flex:1;min-width:120px;accent-color:#FF5E95}
.ctrl .time{font-family:var(--mono);font-size:12px;opacity:.8}
.side{display:flex;flex-direction:column;gap:16px;min-width:0}
.panel{background:var(--surface);border-radius:var(--r);padding:18px;box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;gap:12px}
.panel h2{font-size:22px;line-height:1.1}
.panel h4{margin:0;font-size:13px;font-weight:800}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:700;text-align:right}
.req{display:flex;flex-direction:column;gap:6px}
.req a{display:flex;align-items:center;gap:8px;font-size:13px;text-decoration:none;padding:8px 10px;border-radius:10px;background:var(--bg)}
.req a .ok{color:var(--good);font-weight:900}.req a .no{color:var(--muted);font-weight:900}
.phone-wrap{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.phone{width:196px;aspect-ratio:9/19.5;border-radius:30px;background:#0A0910;padding:8px;box-shadow:0 0 0 2px var(--line),var(--shadow);flex:none;position:relative}
.phone canvas{width:100%;height:100%;border-radius:23px;display:block;background:#000}
.phone::before{content:"";position:absolute;top:13px;left:50%;transform:translateX(-50%);width:54px;height:14px;border-radius:10px;background:#0A0910;z-index:1}
.phone-info{flex:1;min-width:160px;display:flex;flex-direction:column;gap:10px;font-size:13px}

/* studio */
.studio-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;padding-block:30px 8px}
.studio-head h1{font-size:clamp(28px,4.5vw,44px);font-weight:900}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px}
@media (max-width:860px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi .v{font-size:clamp(15px,4.4vw,19px);overflow-wrap:anywhere}}
.kpi{min-width:0;background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:inset 0 0 0 1px var(--line)}
.kpi .v{font-family:var(--display);font-weight:900;font-size:26px;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.main{background:var(--ink);color:var(--bg);box-shadow:none}
.kpi.main .eyebrow,.kpi.main .s{color:color-mix(in srgb,var(--bg) 65%,transparent)}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-top:16px}
@media (max-width:860px){.two{grid-template-columns:1fr}}
.chart svg{width:100%;height:auto;display:block}
.chart .bar{fill:var(--accent-soft)}.chart .bar.cur{fill:var(--accent)}
.chart .grid line{stroke:var(--line)}
.chart text{fill:var(--muted);font-family:var(--mono);font-size:11px}
.chart text.val{fill:var(--ink);font-weight:700}
.mix{display:flex;flex-direction:column;gap:10px}
.mix .r{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13px}
.mix .track{grid-column:1/-1;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.mix .track i{display:block;height:100%;background:var(--hot);border-radius:99px}
.tablebox{overflow-x:auto;background:var(--surface);border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--line)}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:680px}
th{text-align:left;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:12px 14px;border-bottom:1px solid var(--line)}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono)}
.pbar{width:80px;height:6px;border-radius:9px;background:var(--surface-2);display:inline-block;vertical-align:middle;overflow:hidden;margin-right:6px}
.pbar i{display:block;height:100%;background:var(--good)}
.seg{display:inline-flex;flex-wrap:wrap;max-width:100%;background:var(--surface-2);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;border-radius:999px;padding:8px 14px;font-weight:800;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.turma{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:inset 0 0 0 1px var(--line)}
.lchip{font-size:11.5px;font-weight:700;padding:4px 8px;border-radius:8px;background:var(--bg)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.lab{font-size:12px;font-weight:800;color:var(--muted)}
.inp{width:100%;border:0;background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--line);border-radius:10px;padding:10px 12px;outline:none}
.inp:focus{box-shadow:inset 0 0 0 2px var(--accent)}
.money{display:flex;align-items:center;background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--line);border-radius:10px;padding-left:12px}
.money span{font-weight:800;color:var(--muted);font-size:13px}
.money .inp{box-shadow:none;background:transparent;font-family:var(--mono);font-weight:700}
.lrow{display:grid;grid-template-columns:44px minmax(0,1fr) 150px 110px auto;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow .mini{--h:260;width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,hsl(var(--h) 80% 55%),hsl(calc(var(--h) + 40) 80% 30%))}
.lrow b{display:block;font-size:14px}
.lrow small{color:var(--muted);font-size:12px}
.lrow .acts{display:flex;gap:6px}
@media (max-width:760px){.lrow{grid-template-columns:44px minmax(0,1fr)}.lrow>*:nth-child(n+3){grid-column:1/-1}}

/* form */
.form{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:26px;padding-block:24px 60px}
@media (max-width:900px){.form{grid-template-columns:minmax(0,1fr)}}
.fsec{background:var(--surface);border-radius:var(--r);padding:20px;box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;gap:14px}
.fsec h3{font-size:15px;display:flex;align-items:center;gap:10px}
.fsec h3 em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--accent);background:var(--accent-soft);padding:3px 7px;border-radius:6px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.fgrid{grid-template-columns:1fr}}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tiles.two-c{grid-template-columns:repeat(2,1fr)}
@media (max-width:640px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{position:relative;cursor:pointer}
.tile input{position:absolute;opacity:0;pointer-events:none}
.tile>span{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:12px;background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--line);height:100%}
.tile input:checked+span{box-shadow:inset 0 0 0 2.5px var(--accent);background:var(--accent-soft)}
.tile input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.tile b{font-size:13px;font-family:var(--mono);letter-spacing:.06em}
.tile small{font-size:12px;color:var(--muted)}
.shape{border:2px solid currentColor;border-radius:4px;opacity:.8}
.shape.h{width:46px;height:28px}.shape.v{width:24px;height:40px}
.switch{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:12px;background:var(--bg);cursor:pointer}
.switch input{width:40px;height:22px;appearance:none;-webkit-appearance:none;background:var(--line);border-radius:99px;position:relative;flex:none;cursor:pointer;margin:2px 0 0}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(18px)}
.crop-demo{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.cd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--muted);font-weight:700}
.cd .ph{width:54px;height:112px;border-radius:10px;background:#000;box-shadow:0 0 0 2px var(--line);position:relative;overflow:hidden;display:grid;place-items:center}
.cd .ph i{display:block;background:linear-gradient(135deg,#7B5CFF,#FF4F8B)}
.cd .ph i.lb{width:100%;aspect-ratio:16/9}
.cd .ph i.cr{height:100%;aspect-ratio:16/9}
.cd.on{color:var(--accent)}.cd.on .ph{box-shadow:0 0 0 2.5px var(--accent)}
.checks{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow:auto}
.checks label{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--bg);font-size:13px;cursor:pointer}
.checks input{accent-color:var(--accent);width:16px;height:16px}
.drop{border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;cursor:pointer;background:var(--bg)}
.drop:hover{border-color:var(--accent)}
.drop strong{font-size:14px}
.preview-col{position:sticky;top:86px;align-self:start;display:flex;flex-direction:column;gap:12px}
.calc{font-size:13px;display:flex;flex-direction:column;gap:4px;padding:12px;border-radius:10px;background:var(--bg)}
.calc div{display:flex;justify-content:space-between}
.calc .net{font-weight:800;color:var(--good)}
.err{color:var(--hot);font-weight:700;font-size:13px}

/* trilha do aluno */
.me{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center;padding-block:34px 10px}
.rank{width:120px;height:120px;border-radius:30px;background:conic-gradient(var(--hot) calc(var(--p)*1%),var(--surface-2) 0);display:grid;place-items:center}
.rank div{width:96px;height:96px;border-radius:22px;background:var(--bg);display:grid;place-items:center;text-align:center;font-family:var(--display);font-weight:900;font-size:13px}
.rank small{display:block;font-family:var(--mono);font-size:10px;color:var(--muted);font-weight:500}
.me h1{font-size:clamp(28px,5vw,44px);font-weight:900}

/* modal + toast */
.crop-frame{position:relative;width:100%;overflow:hidden;border-radius:14px;background:#000;touch-action:none;cursor:grab;user-select:none}
.crop-frame img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;pointer-events:none}
.crop-grid{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent 33.2%,rgba(255,255,255,.35) 33.3%,transparent 33.5%,transparent 66.5%,rgba(255,255,255,.35) 66.6%,transparent 66.8%),linear-gradient(transparent 33.2%,rgba(255,255,255,.35) 33.3%,transparent 33.5%,transparent 66.5%,rgba(255,255,255,.35) 66.6%,transparent 66.8%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.6)}
.capa-row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.capa-prev{width:120px;aspect-ratio:4/4.3;border-radius:12px;flex:none;overflow:hidden;background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--line);display:grid;place-items:center;font-size:12px;color:var(--muted);text-align:center;padding:8px}
.capa-prev img{width:100%;height:100%;object-fit:cover;display:block}
.modal{position:fixed;inset:0;z-index:20;background:rgba(10,8,16,.55);display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);border-radius:22px;width:min(480px,100%);padding:22px;display:flex;flex-direction:column;gap:14px;max-height:90vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.opt{display:flex;gap:12px;align-items:center;padding:14px;border-radius:14px;background:var(--bg);cursor:pointer;box-shadow:inset 0 0 0 1.5px var(--line)}
.opt:has(input:checked){box-shadow:inset 0 0 0 2.5px var(--accent)}
.opt input{accent-color:var(--accent)}
.opt div{flex:1}
.opt b{display:block}
.opt small{color:var(--muted)}
.opt .p{font-family:var(--display);font-weight:900;font-size:18px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(140%);z-index:30;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;font-size:14px;transition:transform .3s;max-width:calc(100% - 32px)}
.toast{visibility:hidden}
.toast.show{transform:translateX(-50%) translateY(0);visibility:visible}
footer{padding-block:40px 60px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:50px}
footer button{background:none;border:0;color:var(--accent);font-weight:700;cursor:pointer;padding:0}
.empty{padding:30px;text-align:center;color:var(--muted);background:var(--surface);border-radius:var(--r)}
@media (max-width:560px){.acct .who{display:none}.top .role{display:none}.acct{margin-left:auto}.logo .lg{height:34px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

const FEE = 0.10;
const LEVELS = [
  {k:'INICIANTE', d:'Primeiro contato, passos base'},
  {k:'BÁSICO', d:'Já conhece a base e segue contagem'},
  {k:'INTERMEDIÁRIO', d:'Coreografia completa, ritmo real'},
  {k:'AVANÇADO', d:'Velocidade, detalhes e performance'}
];

const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const xpOf = l=>[60,120,220,360][l.level];
const parseDur = d=>{const [m,s]=String(d||'10:00').split(':').map(Number);return (m||0)*60+(s||0)||600};
const fmtT = s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
const initials = n=>n.split(' ').map(p=>p[0]).slice(0,2).join('');

/* ---------- dados fake ---------- */
let S={teachers:[],lessons:[],students:[],done:[],access:{turmas:[],passes:[],lessons:[]},user:null,studio:null,me:null,pagamentoReal:false};
const videoBlobs={}; // vídeo escolhido no formulário toca só neste navegador (envio para o Drive ainda não ligado)
let DONO_TID=null;
const qTid=()=>DONO_TID?'?tid='+encodeURIComponent(DONO_TID):'';
async function api(method,url,body){
  const r=await fetch(url,{method,headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined,credentials:'same-origin'});
  let j={};try{j=await r.json()}catch(e){}
  if(!r.ok){const err=new Error(j.erro||'Não deu certo agora. Tente de novo.');err.status=r.status;throw err}
  return j;
}
async function refresh(){const j=await api('GET','/api/estado'+qTid());S=Object.assign(j,{students:j.studio?j.studio.students:[],me:j.studio?j.studio.teacherId:null})}
async function apos(promessa,msg){try{await promessa;await refresh();if(msg)toast(msg);route(true)}catch(e){toast(e.message)}}
const salvarPrecos=t=>api('PUT','/api/professor/precos'+qTid(),{pricing:t.pricing});
const salvarAula=l=>api('POST','/api/professor/aula'+qTid(),l);

/* ---------- regras ---------- */
const teacher=id=>S.teachers.find(t=>t.id===id);
const lesson=id=>S.lessons.find(l=>l.id===id);
const tLessons=tid=>S.lessons.filter(l=>l.teacherId===tid);
function hasAccess(l){
  if(!l.price) return true;
  if(S.access.lessons.includes(l.id)) return true;
  const t=teacher(l.teacherId);
  return S.access.passes.includes(t.id);
}
function status(l){if(S.done.includes(l.id))return'done';if(!hasAccess(l))return'lock-pay';return'open'}
function stateLabel(l,st){return{done:['done','Concluída'],open:['open',l.price?'Liberada':'Grátis'],'lock-pay':['pay',brl(l.price)],'lock-pre':['pre','Bloqueada']}[st]}
function xpTotal(){return S.done.map(lesson).filter(Boolean).reduce((a,l)=>a+xpOf(l),0)}
function rankOf(xp){let r=RANKS[0],next=null;for(let i=0;i<RANKS.length;i++){if(xp>=RANKS[i][0]){r=RANKS[i];next=RANKS[i+1]||null}}return{name:r[1],from:r[0],next}}

/* ---------- peças de UI ---------- */
const STAR='<path d="M12 2.6l2.8 6 6.5.7-4.9 4.4 1.4 6.4L12 16.9 6.2 20.1l1.4-6.4L2.7 9.3l6.5-.7z"/>';
function stars(level,lg){let s='';for(let i=0;i<4;i++)s+=`<svg viewBox="0 0 24 24" class="${i<=level?'f':'e'}" aria-hidden="true">${STAR}</svg>`;return`<span class="stars${lg?' lg':''}" role="img" aria-label="${level+1} de 4 estrelas">${s}</span>`}
const LOCK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10V7a5 5 0 0110 0v3h1a1 1 0 011 1v9a1 1 0 01-1 1H6a1 1 0 01-1-1v-9a1 1 0 011-1h1zm2 0h6V7a3 3 0 00-6 0v3z"/></svg>';
const CHECK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 16.2L5.3 12l-1.4 1.4 5.6 5.6L20.1 8.4 18.7 7z"/></svg>';
const PLAY='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg>';
const PAUSE='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>';
const orient=l=>`<span class="orient"><i class="${l.orientation}"></i>${l.orientation==='v'?'VERT':'HORIZ'}</span>`;

const capaSrc=l=>l.coverData||l.cover||'';
function card(l){
  const t=teacher(l.teacherId),st=status(l),[cls,lab]=stateLabel(l,st);
  const veil='';
  return `<a class="card st-${st}" href="#aula-${l.id}">
    <div class="cover${capaSrc(l)?' has-img':''}" style="--h:${l.hue}${capaSrc(l)?`;--img:url('${capaSrc(l)}')`:''}">
      <div class="cover-top"><span class="lvl">${LEVELS[l.level].k}</span>${orient(l)}</div>
      <div class="cover-title"><span class="artist">${esc(l.artist||MODS[l.modality])}</span><span class="song${songCls(l.song)}">${esc(l.song)}</span></div>
      ${!l.price&&st!=='done'?'<span class="ribbon">GRÁTIS</span>':''}${st==='done'?'<span class="stamp">CLEAR</span>':''}${veil}
    </div>
    <div class="card-body">
      <div class="row">${stars(l.level)}<span class="xp">+${xpOf(l)} XP</span></div>
      <h3>${esc(l.title)}</h3>
      <div class="meta">${MODS[l.modality]} · ${CATS[l.category]} · ${esc(l.duration)}</div>
      <div class="foot"><span>${esc(t.name)}</span><span class="state ${cls}">${lab}</span></div>
    </div></a>`;
}
function songCls(s){const w=Math.max(...s.split(/\s+/).map(x=>x.length));return w>11||s.length>26?' xl':w>8||s.length>16?' long':''}
function photo(t){return t.photo?`<img src="${t.photo}" alt="Foto de ${esc(t.name)}">`:`<span class="ph-gen" style="--h:${t.hue}"><b>${initials(t.name)}</b><small>foto do professor</small></span>`}
function tAccess(t){return S.access.passes.includes(t.id)?'Mensalidade':null}
function fromPrice(t){return `${brl(t.pricing.passPrice)}/mês · todas as aulas`}
function pcard(t){const ls=tLessons(t.id),free=ls.filter(l=>!l.price).length,acc=tAccess(t);
  return `<a class="pcard" href="#prof-${t.id}"><span class="pphoto">${photo(t)}</span>
  <span class="pinfo"><span class="ptags">${t.styles.map(s=>`<i>${MODS[s]}</i>`).join('')}${free?`<i class="free">${free} grátis</i>`:''}</span>
  <strong>${esc(t.name)}</strong>
  <span class="pmeta"><span>${ls.length} aulas</span><span>${acc?'Você tem acesso':fromPrice(t)}</span></span></span></a>`}
function tcard(t){
  const n=tLessons(t.id).length;
  return `<a class="tcard" href="#prof-${t.id}"><span class="ava" style="--h:${t.hue}">${initials(t.name)}</span>
  <span><strong>${esc(t.name)}</strong><small>${t.styles.map(s=>MODS[s]).join(' · ')} · ${n} aulas</small><br><small>${pricingLine(t)}</small></span></a>`;
}
function pricingLine(t){return fromPrice(t)}

/* ---------- views ---------- */
const UI={mod:'all',cat:'all',lvl:'all',q:'',tid:null,tab:'aulas'};

    </ol>
  </section>`;
}
function chips(k,map){return Object.entries(map).sort((x,y)=>(y[0]==='all')-(x[0]==='all')).map(([v,lab])=>`<button class="chip${String(UI[k])===v?' on':''}" data-act="filter" data-k="${k}" data-v="${v}">${lab}</button>`).join('')}
function renderGrid(){
  const q=UI.q.trim().toLowerCase();
  const list=(UI.tid?tLessons(UI.tid):S.lessons).filter(l=>(UI.mod==='all'||l.modality===UI.mod)&&(UI.cat==='all'||l.category===UI.cat)&&(UI.lvl==='all'||l.level==UI.lvl)&&
    (!q||`${l.title} ${teacher(l.teacherId).name}`.toLowerCase().includes(q)));

function readForm(){
  const f=$('#lform');if(!f)return;const fd=new FormData(f);
  D.freeTitle=fd.get('freeTitle')==='on';
  if(D.freeTitle){D.artist='';D.song=(fd.get('ftitle')||'').trim()}else{D.artist=(fd.get('artist')||'').trim();D.song=(fd.get('song')||'').trim()}
  D.title=D.artist?`${D.artist} - ${D.song}`:D.song;
  D.level=Number(fd.get('level'));D.modality=fd.get('modality');D.category=fd.get('category');D.orientation=fd.get('orientation');
  D.cropMobile=fd.get('cropMobile')==='on';D.price=Math.max(0,Number(fd.get('price'))||0);
  D.duration=(fd.get('duration')||'').trim();
}
function formPreview(){
  readForm();
  $('#ktitle').hidden=D.freeTitle;$('#ftitle').hidden=!D.freeTitle;
  $('#tprev').textContent=D.title||'(preencha artista e música)';
  const cs=D.removeCover?'':capaSrc(D);$('#capaPrev').innerHTML=cs?`<img src="${cs}" alt="Capa da aula">`:'Sem capa';$('#semCapa').hidden=!cs;
  $('#cropBox').hidden=D.orientation!=='h';
  $('#cdOn').classList.toggle('on',D.cropMobile);$('#cdOff').classList.toggle('on',!D.cropMobile);
  const t=teacher(D.teacherId);
  $('#calc').innerHTML=D.price?`<div><span>Aluno paga (avulsa)</span><span class="mono">${brl(D.price)}</span></div><div><span>Taxa MOVRA (10%)</span><span class="mono">−${brl(D.price*FEE)}</span></div><div class="net"><span>Você recebe</span><span class="mono">${brl(D.price*(1-FEE))}</span></div>`:'<div><span>Aula grátis</span><span>sem cobrança</span></div>';
  const fake=Object.assign({},D,D.removeCover?{cover:'',coverData:''}:{},{id:D.id||'__p',title:D.title||'ARTISTA - MÚSICA',song:D.song||'MÚSICA',artist:D.freeTitle?'':(D.artist||'ARTISTA'),duration:D.duration||'--:--',bpm:Number(D.bpm)||110});
  const prev=S.lessons;S.lessons=[...prev.filter(l=>l.id!==fake.id),fake];

function submitForm(){
  readForm();
  if(!D.song){$('#ferr').textContent=D.freeTitle?'Escreva o título da aula.':'Preencha artista e música para montar o título.';return}
  if(!D.freeTitle&&!D.artist){$('#ferr').textContent='Preencha o artista ou grupo.';return}
  if(D.duration&&!/^\d{1,3}:\d{2}$/.test(D.duration)){$('#ferr').textContent='Duração no formato minutos:segundos, por exemplo 18:40.';return}
  const data={teacherId:D.teacherId,artist:D.artist,song:D.song,title:D.title,modality:D.modality,category:D.category,level:D.level,orientation:D.orientation,
    cropMobile:D.orientation==='h'?D.cropMobile:true,price:D.price,duration:D.duration||'15:00',bpm:Number(D.bpm)||110,hue:D.hue,coverData:D.coverData||undefined,removeCover:!!D.removeCover};
  const btn=$('#lform button[type=submit]');btn.disabled=true;
  salvarAula(Object.assign({id:D.id||undefined},data)).then(async r=>{if(D.blob)videoBlobs[r.id]=D.blob;await refresh();toast(D.id?'Aula atualizada':'Aula publicada');location.hash='aula-'+r.id})
    .catch(e=>{$('#ferr').textContent=e.message;btn.disabled=false});
}

/* ---------- player ---------- */
let P=null;
function stopPlayer(){if(P){cancelAnimationFrame(P.raf);if(P.video)P.video.pause();P=null}}
function mountPlayer(l){
  const stage=$('#stage');const v=l.orientation==='v';const W=v?540:960,H=v?960:540;
  const st=status(l);
  P={l,W,H,t:0,playing:false,speed:1,mirror:false,phoneFull:false,last:performance.now(),limit:st==='lock-pay'?15:null};
  if(videoBlobs[l.id]){P.video=document.createElement('video');P.video.src=videoBlobs[l.id];P.video.playsInline=true;P.video.addEventListener('ended',()=>{P&&(P.video.currentTime=0,setPlaying(false))});stage.appendChild(P.video);P.src=P.video;P.dur=1}
  else{P.canvas=document.createElement('canvas');P.canvas.width=W;P.canvas.height=H;stage.appendChild(P.canvas);P.ctx=P.canvas.getContext('2d');P.src=P.canvas;P.dur=parseDur(l.duration)}
  P.pc=$('#phoneCanvas');P.pctx=P.pc.getContext('2d');
  if(P.ctx)drawScene(P.ctx,W,H,0,l,false);
  P.raf=requestAnimationFrame(loop);
}
function loop(now){
  if(!P)return;const dt=Math.min(.1,(now-P.last)/1000);P.last=now;
  if(P.video){P.t=P.video.currentTime;P.dur=P.video.duration||1}
  else if(P.playing){P.t+=dt*P.speed;if(P.t>=P.dur){P.t=0;setPlaying(false)}}
  if(P.limit&&P.t>=P.limit){setPlaying(false);P.t=0;if(P.video)P.video.currentTime=0;showVeil()}
  if(P.ctx)drawScene(P.ctx,P.W,P.H,P.t,P.l,P.mirror);
  drawPhone();
  const seek=$('#seek');if(seek&&!P.arrastando)seek.value=Math.round(P.t/(P.dur||1)*1000);
  const tm=$('#time');if(tm)tm.textContent=`${fmtT(P.t)} / ${fmtT(P.dur)}`;
  P.raf=requestAnimationFrame(loop);
}
function setPlaying(on){if(!P)return;P.playing=on;if(P.video){on?P.video.play().catch(()=>{}):P.video.pause()}
  const b=$('#playBtn');if(b){b.innerHTML=on?PAUSE:PLAY;b.setAttribute('aria-label',on?'Pausar':'Tocar')}}
function showVeil(){const l=P.l,st=status(l),vl=$('#veil');if(!vl)return;
  vl.innerHTML=`<div><h3>Fim da prévia</h3><p style="margin:0;opacity:.8">Assine a mensalidade ou compre esta aula para assistir completa.</p>${hasAccess(l)?'':`<button class="btn hot" data-act="buy" data-kind="lesson" data-id="${l.id}">Desbloquear</button>`}<button class="btn ghost sm" style="color:#fff" data-act="veiloff">Ver prévia de novo</button></div>`;vl.hidden=false}

function drawScene(ctx,W,H,t,l,mirror){
  const hue=l.hue,beat=t*(l.bpm||110)/60,s=Math.min(W,H);
  let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,`hsl(${hue} 55% 20%)`);g.addColorStop(1,`hsl(${hue+30} 60% 5%)`);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const sx=W/2+Math.sin(t*.7)*W*.18;const rg=ctx.createRadialGradient(sx,-H*.1,10,sx,H*.5,H*.9);rg.addColorStop(0,'rgba(255,255,255,.28)');rg.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);
  const fy=H*.8;ctx.strokeStyle=`hsla(${hue+40},90%,70%,.25)`;ctx.lineWidth=1;
  for(let i=0;i<7;i++){const y=fy+(H-fy)*Math.pow(i/6,1.7);ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
  for(let i=-8;i<=8;i++){ctx.beginPath();ctx.moveTo(W/2+i*W*.05,fy);ctx.lineTo(W/2+i*W*.16,H);ctx.stroke()}
  ctx.save();if(mirror){ctx.translate(W,0);ctx.scale(-1,1)}
  dancer(ctx,W/2,fy,s*.62,beat,hue);ctx.restore();
  ctx.textAlign='left';ctx.textBaseline='top';ctx.fillStyle='rgba(255,255,255,.9)';ctx.font=`900 ${Math.round(s*.04)}px Unbounded,sans-serif`;ctx.fillText(l.song.toUpperCase(),s*.05,s*.05);
  ctx.font=`500 ${Math.round(s*.024)}px "JetBrains Mono",monospace`;ctx.fillStyle='rgba(255,255,255,.6)';ctx.fillText(`${(l.artist||MODS[l.modality]).toUpperCase()} · VÍDEO DE DEMONSTRAÇÃO`,s*.05,s*.05+s*.055);
}
function dancer(ctx,cx,fy,size,beat,hue){
  const u=size/8,s=Math.sin(beat*Math.PI),pat=Math.floor(beat/8)%4,hit=Math.pow(Math.abs(s),.5);
  const bob=Math.abs(Math.sin(beat*Math.PI))*u*.35;
  let lu,lf,ru,rf,ll,lk,rl,rk,lean=0;
  if(pat===0){lu=.4+1.3*(s*.5+.5);lf=lu+.9;ru=.4+1.3*(.5-s*.5);rf=ru+.9;ll=.18;lk=-.25*hit;rl=.18;rk=-.25*hit}
  else if(pat===1){lu=2.7+.35*s;lf=lu+.5*s;ru=2.7-.35*s;rf=ru-.5*s;ll=.12+.25*Math.max(0,s);lk=-.5*Math.max(0,s);rl=.12+.25*Math.max(0,-s);rk=-.5*Math.max(0,-s);lean=.08*s}
  else if(pat===2){lean=.18*s;lu=.5;lf=2.2+.4*s;ru=.5;rf=2.2-.4*s;ll=.1+.45*Math.max(0,s);lk=-.6*Math.max(0,s);rl=.1+.45*Math.max(0,-s);rk=-.6*Math.max(0,-s)}
  else{ru=2.1+.25*hit;rf=2.2+.2*hit;lu=.25+.5*hit;lf=1.4;ll=.25;lk=-.2;rl=.25;rk=-.2;lean=-.06}
  const thigh=u*1.7,shin=u*1.7,torso=u*2.4,ua=u*1.3,fa=u*1.15,hr=u*.55;
  const hipY=fy-thigh-shin+bob*1.2,hx=cx;
  const shX=hx+Math.sin(lean)*torso,shY=hipY-Math.cos(lean)*torso;
  const seg=(x,y,a,len,side)=>[x+side*Math.sin(a)*len,y+Math.cos(a)*len];
  ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#fff';ctx.lineWidth=u*.42;
  ctx.shadowColor=`hsl(${hue+40} 100% 70%)`;ctx.shadowBlur=u*.9;
  const draw=pts=>{ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(const p of pts.slice(1))ctx.lineTo(p[0],p[1]);ctx.stroke()};
  const lK=seg(hx-u*.35,hipY,ll,thigh,-1),lF=seg(lK[0],lK[1],ll+lk,shin,-1);
  const rK=seg(hx+u*.35,hipY,rl,thigh,1),rF=seg(rK[0],rK[1],rl+rk,shin,1);
  draw([[hx-u*.35,hipY],lK,[lF[0],Math.min(lF[1],fy)]]);draw([[hx+u*.35,hipY],rK,[rF[0],Math.min(rF[1],fy)]]);
  draw([[hx,hipY],[shX,shY]]);
  const lE=seg(shX-u*.5,shY,lu,ua,-1),lH=seg(lE[0],lE[1],lf,fa,-1);
  const rE=seg(shX+u*.5,shY,ru,ua,1),rH=seg(rE[0],rE[1],rf,fa,1);
  draw([[shX-u*.5,shY],lE,lH]);draw([[shX+u*.5,shY],rE,rH]);draw([[shX-u*.5,shY],[shX+u*.5,shY]]);
  ctx.beginPath();ctx.arc(shX+Math.sin(lean)*hr*1.6,shY-hr*1.7,hr,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();
  ctx.shadowBlur=0;
  ctx.beginPath();ctx.ellipse(cx,fy+u*.1,u*1.6,u*.22,0,0,Math.PI*2);ctx.fillStyle='rgba(0,0,0,.35)';ctx.fill();
}
function fit(ctx,src,sw,sh,x,y,w,h,cover){
  const k=cover?Math.max(w/sw,h/sh):Math.min(w/sw,h/sh),dw=sw*k,dh=sh*k;
  ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();ctx.drawImage(src,x+(w-dw)/2,y+(h-dh)/2,dw,dh);ctx.restore();
}
function drawPhone(){
  if(!P||!P.pctx)return;const c=P.pctx,w=P.pc.width,h=P.pc.height,l=P.l;
  const sw=P.video?P.video.videoWidth:P.W,sh=P.video?P.video.videoHeight:P.H;
  c.fillStyle='#000';c.fillRect(0,0,w,h);if(!sw)return;
  if(P.phoneFull){
    fit(c,P.src,sw,sh,0,0,w,h,l.orientation==='v'||l.cropMobile);
    c.fillStyle='rgba(0,0,0,.45)';c.fillRect(0,h-64,w,64);c.fillStyle='#fff';c.font='700 18px Manrope,sans-serif';c.textAlign='left';c.textBaseline='middle';
    c.fillText(l.orientation==='v'?'Vertical · tela toda':l.cropMobile?'Crop vertical ativo':'Sem crop · faixas pretas',20,h-32);
  } else {
    c.fillStyle='#121019';c.fillRect(0,0,w,h);
    const top=60,boxH=l.orientation==='v'?h*.64:w*sh/sw;
    fit(c,P.src,sw,sh,0,top,w,boxH,l.orientation==='v');
    let y=top+boxH+30;c.fillStyle='#fff';c.textAlign='left';c.textBaseline='top';c.font='800 22px Manrope,sans-serif';
    const words=l.title;c.fillText(words.length>24?words.slice(0,23)+'…':words,20,y);y+=34;
    c.fillStyle='#FF4F8B';for(let i=0;i<4;i++){c.globalAlpha=i<=l.level?1:.25;c.font='22px sans-serif';c.fillText('★',20+i*24,y)}c.globalAlpha=1;y+=36;
    c.fillStyle='rgba(255,255,255,.55)';c.font='500 16px Manrope,sans-serif';c.fillText(teacher(l.teacherId).name+' · '+l.duration,20,y);y+=40;
    for(let i=0;i<3&&y<h-40;i++){c.fillStyle='rgba(255,255,255,.08)';c.beginPath();c.roundRect?c.roundRect(20,y,w-40,46,12):c.rect(20,y,w-40,46);c.fill();y+=58}
  }
}

  const m=$('#modal');

    <div class="calc" id="bcalc"></div>
    <div style="display:flex;gap:10px;justify-content:flex-end"><button type="button" class="btn ghost" data-act="close">Cancelar</button><button class="btn hot" type="submit">${S.pagamentoReal||t.mpConectado?'Pagar com Pix ou cartão':'Continuar'}</button></div><span class="err" id="berr"></span></form>
    <small class="muted">${S.pagamentoReal||t.mpConectado?'Você vai para o Mercado Pago e escolhe Pix, cartão de crédito ou de débito. O acesso é liberado assim que o pagamento é aprovado.':'Modo demonstração: o Mercado Pago ainda não foi ligado, nenhum dinheiro é cobrado.'}</small></div>`;
  m.hidden=false;
  const upd=()=>{const o=opts[Number(new FormData($('#buyf')).get('o'))];$('#bcalc').innerHTML=`<div><span>Total</span><span class="mono">${brl(o.price)}</span></div><div><span>Vai para ${esc(t.name.split(' ')[0])} (90%)</span><span class="mono">${brl(o.price*(1-FEE))}</span></div><div><span>Taxa MOVRA (10%)</span><span class="mono">${brl(o.price*FEE)}</span></div>`};
  upd();$('#buyf').addEventListener('change',upd);

}
function closeModal(){const m=$('#modal');m.hidden=true;m.innerHTML='';m._depois=null}
function openAuth(modo,papel,depois,aviso){
  const m=$('#modal'),cad=modo==='cadastro';

/* ---------- recorte de imagem ---------- */
function openCrop(file,aspect,outW,titulo,pronto){
  const url=URL.createObjectURL(file),img=new Image();
  img.onerror=()=>{URL.revokeObjectURL(url);toast('Não deu para ler essa imagem. Tente um JPG ou PNG.')};
  img.onload=()=>{
    const m=$('#modal');
    m.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="ct" style="width:min(520px,100%)">
      <h2 id="ct" style="font-size:20px">${esc(titulo)}</h2><p class="muted" style="margin:0;font-size:13px">Arraste a imagem para enquadrar e use o zoom para aproximar.</p>
      <div class="crop-frame" id="cropFrame" style="aspect-ratio:${aspect}"><img id="cropImg" src="${url}" alt="" draggable="false"><span class="crop-grid" aria-hidden="true"></span></div>
      <div class="field"><label for="cropZoom">Zoom</label><input type="range" id="cropZoom" min="1" max="4" step="0.01" value="1"></div>
      <div style="display:flex;gap:10px;justify-content:flex-end"><button type="button" class="btn ghost" data-act="close">Cancelar</button><button type="button" class="btn acc" id="cropOk">Usar imagem</button></div></div>`;
    m.hidden=false;
    const fr=$('#cropFrame'),im=$('#cropImg'),zoom=$('#cropZoom');
    const W=()=>fr.clientWidth,H=()=>fr.clientHeight;
    let base=Math.max(W()/img.width,H()/img.height),z=1,x=(W()-img.width*base)/2,y=(H()-img.height*base)/2;
    const sc=()=>base*z;
    const clamp=()=>{x=Math.min(0,Math.max(W()-img.width*sc(),x));y=Math.min(0,Math.max(H()-img.height*sc(),y))};
    const draw=()=>{clamp();im.style.width=img.width+'px';im.style.transform=`translate(${x}px,${y}px) scale(${sc()})`};
    const setZoom=nz=>{const s0=sc();z=Math.min(4,Math.max(1,nz));const k=sc()/s0,cx=W()/2,cy=H()/2;x=cx-(cx-x)*k;y=cy-(cy-y)*k;zoom.value=z;draw()};
    draw();
    let drag=null;
    fr.addEventListener('pointerdown',e=>{drag={px:e.clientX,py:e.clientY,x,y};fr.setPointerCapture(e.pointerId)});
    fr.addEventListener('pointermove',e=>{if(!drag)return;x=drag.x+e.clientX-drag.px;y=drag.y+e.clientY-drag.py;draw()});
    fr.addEventListener('pointerup',()=>{drag=null});fr.addEventListener('pointercancel',()=>{drag=null});
    fr.addEventListener('wheel',e=>{e.preventDefault();setZoom(z*(e.deltaY<0?1.08:1/1.08))},{passive:false});
    zoom.addEventListener('input',()=>setZoom(Number(zoom.value)));
    $('#cropOk').addEventListener('click',()=>{
      const outH=Math.round(outW/aspect),c=document.createElement('canvas');c.width=outW;c.height=outH;
      const s=sc();c.getContext('2d').drawImage(img,-x/s,-y/s,W()/s,H()/s,0,0,outW,outH);
      URL.revokeObjectURL(url);closeModal();pronto(c.toDataURL('image/jpeg',.86));
    });
  };
  img.src=url;
}

let ticker;
function route(keep){

  const h=(location.hash.slice(1)||'inicio');let html,key=h;UI.tid=null;
  if(['inicio','explorar','aulas','professores'].includes(h)){html=vExplorar();key='inicio'}
  else if(h==='trilha')html=vTrilha();
  else if(h==='dono')html=vDono();
  else if(h.startsWith('pago-')){html=vPago(h.slice(5));key='inicio'}
  else if(h==='studio-mp-ok'||h==='studio-mp-erro'){toast(h==='studio-mp-ok'?'Mercado Pago conectado':'Não deu para conectar o Mercado Pago. Tente de novo.');location.replace('#studio');return}
  else if(h==='studio')html=vStudio();
  else if(h==='nova-aula'){html=vForm(null);key='studio'}
  else if(h.startsWith('editar-')){html=vForm(h.slice(7));key='studio'}
  else if(h.startsWith('prof-')){html=vProf(h.slice(5));key='inicio'}
  else if(h.startsWith('aula-')){html=vAula(h.slice(5));key='inicio'}
  else html=notFound();
  $('#app').innerHTML=html+`<div class="wrap"><footer><span>MOVRA by Speed · Taxa da plataforma: 10% de cada pagamento.${S.pagamentoReal?'':' Pagamentos em modo demonstração.'}</span><span>Professores e aulas de demonstração.</span></footer></div>`;
  renderAcct();
  fillLogos();
  $$('[data-r]').forEach(a=>a.classList.toggle('on',a.dataset.r===key));
  const prof=key==='studio';$$('#role a').forEach(a=>a.classList.toggle('on',(a.dataset.role==='prof')===prof));
  if($('#lgrid'))renderGrid();
  if(!keep){if(h==='professores')$('#professores').scrollIntoView();else window.scrollTo(0,0)}
  if(h.startsWith('aula-')&&lesson(h.slice(5)))mountPlayer(lesson(h.slice(5)));
  if($('#lform'))formPreview();
  if($('#donoBox'))carregarDono();
  if($('#pagoBox'))checarPago(h.slice(5));
}
window.addEventListener('hashchange',()=>{PEND.del=null;UI.tab='aulas';UI.lvl='all';UI.cat='all';route()});
(async()=>{
  try{await refresh()}catch(e){toast('Sem conexão com o servidor. Recarregue a página.')}
  if(location.pathname.replace(/\/$/,'')==='/dono'&&!location.hash)history.replaceState(null,'','/#dono');
  route();
})();
</script>
